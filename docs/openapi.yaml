openapi: 3.1.0
info:
  version: 1.0.0
  title: Contact App
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  description: REST API for managing user contacts with authorization and filtering.
tags:
  - name: Contacts
    description: Operation with contacts
servers:
  - url: https://hw7-swagger-c2gv.onrender.com

paths:
  /contacts/{id}:
    get:
      $ref: '../swagger/paths/contacts/{id}/get.yaml'
    patch:
      $ref: '../swagger/paths/contacts/{id}/patch.yaml'
    delete:
      $ref: '../swagger/paths/contacts/{id}/delete.yaml'
  /contacts:
    post:
      $ref: '../swagger/paths/contacts/post.yaml'
    get:
      $ref: '../swagger/paths/contacts/get.yaml'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Contact:
      $ref: '../swagger/components/schemas/Contact.yaml'
    UpdateContact:
      $ref: '../swagger/components/schemas/UpdateContact.yaml'
  responses:
    '401':
      $ref: '../swagger/components/responses/401.yaml'
    '500':
      $ref: '../swagger/components/responses/500.yaml'
