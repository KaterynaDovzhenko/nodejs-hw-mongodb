tags:
  - Contacts
summary: Get all contacts with pagination
operationId: getAllContacts
description: Get all contacts with filters and pagination
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
      default: 1
  - name: perPage
    in: query
    required: false
    schema:
      type: integer
      default: 10
  - name: sortOrder
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
      example: asc
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      example: name
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
      example: false
  - name: contactType
    in: query
    required: false
    schema:
      type: string
      enum: [home, work, personal]
      example: home
responses:
  '200':
    description: Successfully retrieved contacts
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - contacts
                - total
                - page
                - perPage
              properties:
                contacts:
                  type: array
                  items:
                    $ref: ../../components/schemas/Contact.yaml
                total:
                  type: integer
                  example: 50
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
  '401':
    $ref: ../../components/responses/401.yaml
  '500':
    $ref: ../../components/responses/500.yaml
