tags:
  - Contacts
summary: Update contacts
operationId: updateContact
description: Update contacts
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: 6841738d9abba11274e4c270
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - status
          - message
          - data
        properties:
          status:
            type: integer
            example: 200
          message:
            type: string
            example: Contact updated
          data:
            type: object
            required:
              - name
              - phoneNumber
              - email
              - isFavourite
              - contactType
              - photo
            properties:
              name:
                type: string
                description: Contact name
                example: Nick White
              phoneNumber:
                type: string
                description: Phone contact
                example: +17674455643
              email:
                type: string
                description: Email contact
                example: nick.white@gmail.com
              isFavourite:
                type: boolean
                description: Contact favourite
                example: false
                default: false
              contactType:
                type: string
                description: Contact type
                enum: ['work', 'home', 'personal']
                example: personal
              photo:
                type: string
                format: url
                description: Contact photo url
                example: https://res.cloudinary.com/df5xsxnzm/image/upload/v1749232498/jpolliyga4egrctz965w.jpg

responses:
  '200':
    description: Contact updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Contact updated
            data:
              $ref: ../../../../components/schemas/contact.yaml
  '201':
    description: Contact updated
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Contact updated
            data:
              $ref: ../../../../components/schemas/contact.yaml
  '401':
    $ref: ../../../../components/responses/401.yaml
  '500':
    $ref: ../../../../components/responses/500.yaml
