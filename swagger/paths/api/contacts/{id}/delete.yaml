tags:
  - Contacts
summary: Delete contacts
operationId: deleteContact
description: Delete contacts
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
      example: 6841738d9abba11274e4c270
responses:
  '204':
    description: Created a contact
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 204
            message:
              type: string
              example: Contact created successfully
            data:
              $ref: ../../../../components/schemas/contact.yaml
  '500':
    $ref: ../../../../components/responses/500.yaml
